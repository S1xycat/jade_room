<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101812">
  <meta name="description" content="个人积分游戏桌，包含百家乐与骰宝。">
  <title>青玉桌 · 每日积分游戏</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%231f3d2c'/%3E%3Ctext x='24' y='36' text-anchor='middle' font-size='33' fill='%23edd39b'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=round20">
  <script type="module" src="./app.js?v=round20"></script>
</head>
<body>
  <header class="topbar">
    <div class="top-inner">
      <div class="brand"><span class="brand-icon" aria-hidden="true">♠</span><span>青玉桌</span></div>
      <div class="top-actions" id="top-actions" hidden>
        <button class="quiet-button" id="history-open" type="button">战绩</button>
        <button class="quiet-button" id="rules-open" type="button">规则</button>
        <div class="balance-box"><span class="balance-icon" aria-hidden="true">◈</span><div><span>可用积分</span><strong id="balance">—</strong></div></div>
      </div>
    </div>
  </header>
  <main class="shell">
    <section id="account-panel" class="account-panel" aria-labelledby="account-title">
      <h1 id="account-title">登录青玉桌</h1>
      <div class="account-modes">
        <button id="login-mode" type="button" class="quiet-button" aria-pressed="true">登录</button>
        <button id="register-mode" type="button" class="quiet-button" aria-pressed="false">注册</button>
      </div>
      <form id="account-form" class="account-form">
        <label>用户名 <input id="username" name="username" required maxlength="48" autocomplete="username"></label>
        <label>密码 <input id="password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password"></label>
        <p class="empty" id="account-hint" hidden>用户名可用 3–24 个字母、数字、下划线或连字符，密码至少 8 个字符。</p>
        <button class="play" id="account-submit" type="submit">登录</button>
        <p class="status" id="account-status" role="status"></p>
      </form>
    </section>
    <div id="game-content" hidden>
    <div class="session-bar">
      <span id="session-name"></span>
      <div class="session-actions">
        <button class="quiet-button" id="admin-open" type="button" hidden>积分管理</button>
        <button class="quiet-button" id="logout" type="button">退出</button>
      </div>
    </div>
    <div class="game-bar">
      <nav class="game-tabs" aria-label="游戏平台">
        <button class="game-tab" type="button" data-game="baccarat" aria-pressed="true"><span aria-hidden="true">♠</span>百家乐 <small id="baccarat-clock"></small></button>
        <button class="game-tab" type="button" data-game="dice" aria-pressed="false"><span aria-hidden="true">⚄</span>骰宝 <small id="dice-clock"></small></button>
      </nav>
      <span class="daily-info">每天 00:00（北京时间）发放 1,000 积分</span>
    </div>
    <div class="layout">
      <section class="game-column" aria-labelledby="game-name">
        <div class="table" id="table">
          <div class="table-heading">
            <h1 id="game-name">百家乐</h1>
            <div class="round-clock">
              <span class="round-note" id="round-note">正在连接</span>
              <strong id="round-clock" aria-label="剩余时间">—</strong>
            </div>
          </div>
          <div class="table-stage" id="stage"></div>
          <p class="table-note" id="table-note" aria-live="polite"></p>
        </div>
        <div class="bets-panel">
          <div class="section-head"><h2>下注区</h2><span>括号内为净赢倍数</span></div>
          <div class="chip-row">
            <p class="small-label">积分档位</p>
            <div id="chips" class="chips"></div>
          </div>
          <div id="main-bets"></div>
          <section class="side-bets" aria-labelledby="side-bets-title">
            <h3 id="side-bets-title">点数与组合</h3>
            <div id="side-bets"></div>
          </section>
        </div>
      </section>
      <aside class="sidebar" aria-label="积分和结算">
        <section class="slip">
          <div class="section-head"><h2>本局下注</h2><button class="text-button" id="clear" type="button">清空</button></div>
          <div class="slip-lines" id="slip-lines"></div>
          <div class="slip-total"><span>当前选择</span><strong id="stake-total">0 积分</strong></div>
          <button class="play" id="play" type="button">确认本局下注</button>
          <p class="confirmed" id="confirmed"></p>
          <p class="status" id="status" role="status"></p>
        </section>
        <section class="settlement">
          <div class="section-head"><h2>上局结算</h2><span id="last-round"></span></div>
          <div id="settlement"></div>
        </section>
      </aside>
    </div>
    </div>
    <footer>积分仅供游戏内使用 · 不支持充值、提现、转赠或兑换</footer>
  </main>
  <dialog id="rules-dialog" aria-labelledby="rules-title">
    <div class="dialog-head"><h2 id="rules-title">玩法规则</h2><form method="dialog"><button class="quiet-button" type="submit">关闭</button></form></div>
    <div id="rules-content" class="dialog-content"></div>
  </dialog>
  <dialog id="history-dialog" aria-labelledby="history-title">
    <div class="dialog-head"><h2 id="history-title">最近战绩</h2><form method="dialog"><button class="quiet-button" type="submit">关闭</button></form></div>
    <div id="history-content" class="dialog-content"></div>
  </dialog>
  <dialog id="admin-dialog" aria-labelledby="admin-title">
    <div class="dialog-head"><h2 id="admin-title">积分管理</h2><form method="dialog"><button class="quiet-button" type="submit">关闭</button></form></div>
    <div class="dialog-content">
      <form class="account-form" id="grant-form">
        <label>注册账户 <select id="grant-account" required></select></label>
        <label>发放积分 <input type="number" id="grant-points" inputmode="numeric" required min="1" step="1"></label>
        <button class="play" id="grant-submit" type="submit">发放积分</button>
        <p class="status" id="grant-status" role="status"></p>
      </form>
      <section><h3>最近发放记录</h3><div id="grant-history"></div></section>
    </div>
  </dialog>
  <noscript><p class="noscript">请开启 JavaScript 后游玩。</p></noscript>
</body>
</html>
